<div class="flex items-center gap-3 px-4 pt-4 pb-5">
  <app-logo class="size-9 shadow-xs" />
  <div class="min-w-0 leading-tight">
    <p class="text-md font-semibold tracking-tight text-fg">HR Assist</p>
    <p class="truncate text-xs text-subtle">Northstar People Team</p>
  </div>
</div>

<div class="px-3">
  <button
    type="button"
    class="flex h-9 w-full cursor-pointer items-center gap-2 rounded-lg border border-line bg-surface px-3 text-sm font-medium text-fg shadow-xs transition-colors not-disabled:hover:border-line-strong not-disabled:hover:bg-surface-sunken disabled:cursor-default disabled:text-subtle disabled:shadow-none"
    data-testid="new-chat"
    title="Start a new conversation"
    [disabled]="!started()"
    (click)="newChat()"
  >
    <svg
      class="size-4"
      viewBox="0 0 24 24"
      aria-hidden="true"
      fill="none"
      stroke="currentColor"
      stroke-width="1.9"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M12 20h9" />
      <path d="M16.4 3.6a2 2 0 0 1 2.9 2.9L7.5 18.3 3.6 19.4l1.1-3.9z" />
    </svg>
    New chat
  </button>
</div>

<nav
  class="mt-6 min-h-0 flex-1 overflow-x-hidden overflow-y-auto px-3"
  aria-labelledby="conversations-title"
>
  <p class="px-2 eyebrow" id="conversations-title">Conversations</p>
  @if (current(); as title) {
    <ul class="mt-2 grid grid-cols-1 gap-0.5">
      <li>
        <p
          class="flex items-center gap-2 rounded-lg bg-surface px-2.5 py-2 text-sm text-fg shadow-xs ring-1 ring-line"
          aria-current="true"
          [title]="title"
        >
          <svg
            class="size-[14px] flex-none text-accent"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" />
          </svg>
          <span class="min-w-0 truncate">{{ title }}</span>
        </p>
      </li>
    </ul>
  } @else {
    <p class="mt-2 px-2 text-xs leading-relaxed text-subtle">
      Your conversation appears here once you ask a question.
    </p>
  }
</nav>

<div class="flex items-center gap-2 border-t border-line px-3 py-3">
  <app-connection-status class="min-w-0 flex-1" />
  <app-theme-toggle />
</div>
