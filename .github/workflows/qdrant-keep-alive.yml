# Pings the health endpoint, which calls Qdrant, so the free cluster isn't suspended.
# A no-op until the API_URL repository variable is set. See README: Keeping the Qdrant cluster awake.

name: Qdrant keep-alive

on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the health endpoint
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::notice::API_URL repository variable is not set, so there is nothing to ping."
            exit 0
          fi
          body=$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 30 --retry-all-errors --max-time 60 \
            "${API_URL%/}/api/health")
          echo "$body"
          if [ "$(echo "$body" | jq -r .qdrant)" != "up" ]; then
            echo "::error::The API is up but could not reach Qdrant."
            exit 1
          fi
