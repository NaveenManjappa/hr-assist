<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
          <path d="m9 14 2 2 4-4.5" />
        </svg>
      </span>
      <span class="brand-name">HR Assist</span>
      <span class="brand-org">Northstar People Operations</span>
    </div>

    <div class="topbar-actions">
      <span class="as-of" title="Questions are answered against this date">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="15" rx="2" />
          <path d="M3.5 10h17M8 3v4M16 3v4" />
        </svg>
        As of
        <time [attr.datetime]="asOfDate() | date: 'yyyy-MM-dd'">{{
          asOfDate() | date: 'd MMM y'
        }}</time>
      </span>
      <app-connection-status />
      <app-theme-toggle />
    </div>
  </header>

  <div class="workspace">
    <main class="conversation">
      <app-conversation />
    </main>

    <aside class="evidence">
      <app-evidence-panel />
    </aside>
  </div>
</div>
