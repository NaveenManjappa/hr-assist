<div
  class="inline-flex rounded-lg border border-line bg-surface-sunken p-0.5"
  role="group"
  aria-label="Theme"
>
  @for (option of options; track option.value) {
    <button
      type="button"
      class="grid h-7 w-7 cursor-pointer place-items-center rounded-md text-subtle transition-colors hover:text-fg aria-pressed:bg-surface aria-pressed:text-fg aria-pressed:shadow-sm"
      [attr.aria-pressed]="preference() === option.value"
      [attr.aria-label]="option.label"
      [title]="option.label"
      (click)="preference.set(option.value)"
    >
      @switch (option.value) {
        @case ('light') {
          <svg
            class="size-[15px]"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        }
        @case ('dark') {
          <svg
            class="size-[15px]"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
          </svg>
        }
        @case ('system') {
          <svg
            class="size-[15px]"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="12" rx="2" />
            <path d="M8 20h8M12 16v4" />
          </svg>
        }
      }
    </button>
  }
</div>
