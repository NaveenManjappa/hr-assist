[project]
name = "hr-assist"
version = "0.1.0"
description = "HR Assist API: grounded answers to Northstar HR policy questions"
authors = [
    { name = "Naveen Manjappa", email = "122058418+NaveenManjappa@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.14.11",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hr-assist = "hr_assist.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
ingest = [
    "langchain-pymupdf4llm>=1.28.0",
    "pymupdf4llm>=1.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.uv]
default-groups = ["dev", "ingest"]
